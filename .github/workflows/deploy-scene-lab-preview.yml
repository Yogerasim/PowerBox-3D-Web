name: Deploy Scene Lab Preview

on:
  push:
    branches:
      - feature/scene-lab-preview-v1

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: powerbox-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build PowerBox
        run: npm run build

      - name: Verify production output
        run: |
          test -f dist/index.html
          test -f dist/viewer.html
          test -f dist/assets/models/collections-manifest.json

          GLB_COUNT="$(
            find dist/assets/models/collections \
              -type f \
              -name '*.glb' \
              | wc -l \
              | tr -d ' '
          )"

          echo "GLB modules in build: $GLB_COUNT"

          if [ "$GLB_COUNT" -eq 0 ]; then
            echo "No GLB collection modules found."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
